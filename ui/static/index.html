<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Agents Crew</title>
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="signal"></span> AGENTS CREW</div>
      <nav aria-label="Primary">
        <button type="button" class="nav-button active" data-view="builder">Builder</button>
        <button type="button" class="nav-button" data-view="crews">Crews</button>
        <button type="button" class="nav-button" data-view="runtime">Runtime</button>
        <button type="button" class="nav-button" data-view="history">History</button>
      </nav>
      <div class="top-actions">
        <div class="theme-switch" aria-label="Color theme">
          <button type="button" class="icon-text-button" data-theme="light" aria-label="Use light theme">Light</button>
          <button type="button" class="icon-text-button" data-theme="dark" aria-label="Use dark theme">Dark</button>
        </div>
        <div id="save-scope-control" class="scope-control" aria-label="Save scope"></div>
      </div>
    </header>

    <main>
      <section id="builder-view" class="view builder-grid">
        <aside class="panel crew-panel">
          <div class="section-heading compact">
<p class="eyebrow">Crew library</p>
            <button type="button" class="info-button" aria-label="About Crew library" data-info-title="Crew library" data-info-text="Search crew definitions">i</button>
          </div>
          <input id="crew-search" class="input" placeholder="Search crews" aria-label="Search crews">
          <div class="crew-actions-row">
            <button id="new-crew" type="button" class="secondary-button icon-button">+ New crew</button>
            <button id="new-group" type="button" class="secondary-button icon-button">+ Group</button>
          </div>
          <div id="crew-list" class="list"></div>
        </aside>
        <div class="sidebar-resizer" data-sidebar-resizer="left" role="separator" aria-label="Resize crew sidebar" aria-orientation="vertical" aria-valuemin="200" aria-valuemax="500" aria-valuenow="250" tabindex="0"></div>

        <section class="canvas-panel">
          <div class="canvas-toolbar">
            <div class="canvas-eyebrow">
              <p class="eyebrow">Crew canvas</p>
              <h1 id="canvas-title" class="sr-only">No Crew</h1>
            </div>
            <div class="canvas-metadata">
              <label>Crew name<input id="crew-name" class="input" placeholder="Crew name" aria-label="Crew name"></label>
              <label>Crew ID<input id="crew-id" class="input" placeholder="lowercase-slug" aria-label="Crew ID"></label>
              <label>Group
                <select id="crew-group" class="input" aria-label="Group name">
                  <option value="">None (Ungrouped)</option>
                </select>
              </label>
            </div>
            <button type="button" class="info-button canvas-info" aria-label="About Crew canvas" data-info-title="Crew canvas" data-info-text="Edit crew metadata here, drag empty space to pan, use the mouse wheel to zoom, and drag nodes to arrange the crew.">i</button>
            <div class="canvas-actions">
              <button id="delete-crew" type="button" class="danger-button icon-only-button" aria-label="Delete crew" title="Delete crew">
                <svg class="button-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M5.5 4.5V3a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1.5M6.5 7v4.5M9.5 7v4.5M4 4.5l.7 8.4a1 1 0 0 0 1 .9h4.6a1 1 0 0 0 1-.9l.7-8.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
              </button>
              <button id="save-crew" type="button" class="primary-button icon-only-button" aria-label="Save crew" title="Save crew">
                <svg class="button-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h8l2.5 2.5v8.5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1zM5 2.5v3.5h5.5V2.5M5.5 14.5v-4.5h5v4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
              </button>
              <button id="add-member" type="button" class="secondary-button icon-only-button" aria-label="Add member" title="Add member">
                <svg class="button-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
              </button>
            </div>
          </div>
          <div id="crew-canvas" class="canvas" aria-label="Crew graph. Drag to pan and use mouse wheel to zoom." tabindex="0">
            <div class="canvas-controls" aria-label="Canvas zoom controls">
              <span id="zoom-level" class="zoom-level">100%</span>
              <button id="fit-graph" type="button" class="secondary-button icon-button">
                <svg class="button-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5V2h3M14 5V2h-3M2 11v3h3M14 11v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                <span>Fit</span>
              </button>
              <button id="reset-zoom" type="button" class="secondary-button icon-button">
                <svg class="button-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 4v4.1h4.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
                <span>Reset zoom</span>
              </button>
            </div>
            <div id="crew-world" class="canvas-world"></div>
          </div>
        </section>

        <div class="sidebar-resizer" data-sidebar-resizer="right" role="separator" aria-label="Resize inspector sidebar" aria-orientation="vertical" aria-valuemin="200" aria-valuemax="500" aria-valuenow="330" tabindex="0"></div>
        <aside class="panel inspector-panel">
          <div class="section-heading compact">
            <p class="eyebrow">Inspector</p>
            <button type="button" class="info-button" aria-label="About Inspector" data-info-title="Inspector" data-info-text="Edit the selected node's host, model, roles, capabilities, and execution requirements. Models are limited to current text LLMs available for the selected adapter.">i</button>
          </div>
          <div id="inspector"></div>
        </aside>
      </section>

      <section id="crews-view" class="view page" hidden>
        <div class="page-heading">
          <div>
            <div class="section-heading compact">
              <p class="eyebrow">Reusable crews</p>
              <button type="button" class="info-button" aria-label="About Crews" data-info-title="Crews" data-info-text="Compare built-in, global, and workspace crew definitions in one table. Workspace crews override matching global IDs.">i</button>
            </div>
            <h2>Crews</h2>
          </div>
        </div>
        <p class="lead">Workspace crews override matching global IDs. Built-in crews remain read-only.</p>
        <div id="crew-table" class="table-shell"></div>
      </section>

      <section id="runtime-view" class="view page" hidden>
        <div class="page-heading">
          <div>
            <div class="section-heading compact">
              <p class="eyebrow">Durable execution</p>
              <button type="button" class="info-button" aria-label="About Runtime" data-info-title="Runtime" data-info-text="Inspect active runs, task progress, events, pending actions, and durable files. Pause, resume, or cancel a non-terminal run.">i</button>
            </div>
            <h2>Runtime</h2>
          </div>
          <button id="refresh-runs" type="button" class="secondary-button">Refresh</button>
        </div>
        <div class="runtime-layout">
          <div id="run-list" class="run-list"></div>
          <article id="run-detail" class="detail-card"><div class="empty">Select an active run.</div></article>
        </div>
      </section>

      <section id="history-view" class="view page" hidden>
        <div class="page-heading">
          <div>
            <div class="section-heading compact">
              <p class="eyebrow">Archived execution</p>
              <button type="button" class="info-button" aria-label="About Run history" data-info-title="Run history" data-info-text="Review completed, failed, blocked, and cancelled runs after they move into durable history. Archived runs are read-only.">i</button>
            </div>
            <h2>History</h2>
          </div>
          <button id="refresh-history" type="button" class="secondary-button">Refresh</button>
        </div>
        <div class="runtime-layout">
          <div id="history-list" class="run-list"></div>
          <article id="history-detail" class="detail-card"><div class="empty">Select an archived run.</div></article>
        </div>
      </section>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="/assets/app.js"></script>
</body>
</html>
