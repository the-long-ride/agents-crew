name: manual-build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or ref to package
        required: true
        type: string
        default: master

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install repository tooling
        run: pnpm install --frozen-lockfile
      - name: Verify source
        run: pnpm run check
      - name: Create npm tarball
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          (cd artifacts && sha256sum *.tgz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: agents-crew-npm-package
          path: artifacts/*
          if-no-files-found: error
