[workspace]
resolver = "3"
members = [
  "crates/agents-crew-core",
  "crates/agents-crew-config",
  "crates/agents-crew-templates",
  "crates/agents-crew-state",
  "crates/agents-crew-protocol",
  "crates/agents-crew-ui",
  "crates/agents-crew-workers",
  "crates/agents-crew-cli-workers",
  "crates/agents-crew-api-workers",
  "crates/agents-crew-git",
  "crates/agents-crew-policy",
  "crates/agents-crew-plugins",
  "crates/agents-crew-prompts",
  "crates/agents-crew-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.86"

[workspace.dependencies]
anyhow = "=1.0.86"
async-trait = "=0.1.80"
chrono = { version = "=0.4.38", features = ["serde", "clock"] }
clap = { version = "=4.5.7", features = ["derive"] }
futures = "=0.3.30"
hex = "=0.4.3"
reqwest = { version = "=0.12.4", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.117"
sha2 = "=0.10.8"
thiserror = "=1.0.61"
tokio = { version = "=1.38.2", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "=0.8.23"
uuid = { version = "=1.8.0", features = ["v4", "serde"] }
walkdir = "=2.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"
